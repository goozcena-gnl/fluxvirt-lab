    <rect x="22" y="158" width="414" height="82" rx="14" fill="#29210d" stroke="#fbbf24"/><rect x="38" y="174" width="116" height="22" rx="11" fill="#713f12"/><text x="54" y="190" fill="#fef3c7" font-size="12" font-weight="800">DOCUMENTED</text><text x="38" y="218" fill="#cbd5e1" font-size="14">K3s, Flux, KubeVirt, CDI, VM and</text><text x="38" y="235" fill="#94a3b8" font-size="12">container outcomes in the v0.1.0 record</text>

  <text x="52" y="58" fill="#f8fafc" font-family="Arial, sans-serif" font-size="29" font-weight="800">KUBERNETES VIRTUALIZATION · RECORDED ARCHITECTURE</text>
  <text x="52" y="88" fill="#94a3b8" font-family="Arial, sans-serif" font-size="15">Evidence class is shown separately from the component path.</text>

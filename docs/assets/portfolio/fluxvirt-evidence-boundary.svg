  <path d="M52 611h1096" stroke="#334155"/><text x="52" y="630" fill="#64748b" font-family="Arial, sans-serif" font-size="12">RECOVERY SCOPE: ONE CHECKSUM-VERIFIED ISOLATED VM-DISK EXERCISE · NO HA, LIVE MIGRATION, RTO/RPO, OR PRODUCTION-STORAGE CLAIM</text>

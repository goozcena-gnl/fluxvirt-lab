<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">FluxVirt architecture and evidence boundary</title><desc id="desc">Nested Windows, VirtualBox, Ubuntu, K3s, Flux, KubeVirt and CDI architecture with explicit retained, documented, external, and static-only evidence classes.</desc>

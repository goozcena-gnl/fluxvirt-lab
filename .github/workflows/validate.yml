name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Load pinned project versions
        shell: bash
        run: |
          set -Eeuo pipefail
          while IFS='=' read -r name value; do
            case "$name" in
              KUBERNETES_VERSION)
                printf '%s=%s\n' "$name" "$value" >> "$GITHUB_ENV"
                ;;
            esac
          done < versions.env

      - name: Install validation tools
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install --user yamllint==1.35.1
          sudo apt-get update
          sudo apt-get install -y shellcheck tar
          curl --proto '=https' --tlsv1.2 -fsSLO "https://dl.k8s.io/release/${KUBERNETES_VERSION}/bin/linux/amd64/kubectl"
          curl --proto '=https' --tlsv1.2 -fsSLO "https://dl.k8s.io/release/${KUBERNETES_VERSION}/bin/linux/amd64/kubectl.sha256"
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check
          sudo install -m 0755 kubectl /usr/local/bin/kubectl
          ./scripts/install/install-kubeconform.sh

      - name: Fetch pinned KubeVirt and CDI manifests
        run: ./scripts/vendor/vendor-platform-manifests.sh

      - name: Run repository validation
        run: ./scripts/validation/validate-repository.sh

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0 known-safe immutable release
        with:
          version: v0.69.3
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
